<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoTrack - Junte-se à Tela Viva</title>
    <link rel="stylesheet" href="css/login.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
</head>
<script src="js/auth.js"></script>
<body>
    <div class="container">
        <section class="hero-side">
            <div class="hero-content">
                <div class="logo">
                    <span class="logo-icon">🌿</span>
                    <span class="logo-text">
                        <a href="home.html">EcoTrack</a>
                    </span>
                </div>
                <h1>Junte-se à <span>Tela Viva.</span></h1>
                <p>Monitore sua pegada de carbono, participe de ações climáticas coletivas e visualize seu impacto positivo no mundo.</p>
                
                <div class="badges">
                    <div class="badge badge-blue">
                        <span class="icon">⚡</span> 1.2M AÇÕES REGISTRADAS
                    </div>
                    <div class="badge badge-green">
                        <span class="icon">👥</span> FOCO NA COMUNIDADE
                    </div>
                </div>
            </div>
            <div class="hero-image-bg"></div>
        </section>

        <section class="form-side">
            <div class="card">
                <h2>Logar conta</h2>
                <p class="login-link">Não possui uma conta? <a href="cadastro.html">Cadastrar</a></p>

                <form>
                    <div class="input-group">
                        <label>NOME COMPLETO</label>
                        <div class="input-wrapper">
                            <span class="field-icon">👤</span>
                            <input type="text" placeholder="">
                        </div>
                    </div>

                    <div class="input-group">
                        <label>ENDEREÇO DE E-MAIL</label>
                        <div class="input-wrapper">
                            <span class="field-icon">@</span>
                            <input type="email" placeholder="">
                        </div>
                    </div>

                    <div class="input-group">
                        <label>SENHA</label>
                        <div class="input-wrapper">
                            <span class="field-icon">🔒</span>
                            <input type="password" placeholder="">
                        </div>
                    </div>

                    <button type="submit" class="btn-main">Entrar agora</button>
                </form>

                <div class="divider">
                    <span>OU CONTINUE COM</span>
                </div>

                <div class="social-login">
                    <button class="btn-social"><img src="https://www.google.com/favicon.ico" alt=""> Google</button>
                    <button class="btn-social"><span class="apple-icon"></span> Apple</button>
                </div>
            </div>
            
            <footer class="form-footer">
                <a href="#">AJUDA</a>
                <a href="#">METODOLOGIA</a>
            </footer>
        </section>
    </div>
</body>
</html>
